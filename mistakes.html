<script>
(function(){
  var t;
  try{ t=localStorage.getItem('theme'); }catch(e){}
  if(t!=='light'&&t!=='dark'){ t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
  document.documentElement.setAttribute('data-theme',t);
})();

<style>
:root {
  --bg:#0d1117; --surface:#161b22; --card:#1c2230;
  --border:#2a3344; --border-strong:#3d4f66;
  --text:#c9d2dd; --muted:#7d8fa8; --faint:#4a5568;
  --heading:#e2eaf2;
  --hover-bg:rgba(255,255,255,.03);
  --th-bg:rgba(255,255,255,.05);
  --tip:#fbbf24; --ok:#34d399; --err:#f87171; --em:#fbbf24;
  --focus:#60a5fa;
  color-scheme:dark;
}
html[data-theme="light"] {
  --bg:#f3f1ec; --surface:#faf9f5; --card:#faf9f5;
  --border:#e2dfd7; --border-strong:#c9c5ba;
  --text:#33393f; --muted:#626b7a; --faint:#9aa1ab;
  --heading:#242930;
  --hover-bg:rgba(45,45,55,.045);
  --th-bg:rgba(45,45,55,.05);
  --tip:#a16207; --ok:#047857; --err:#dc2626; --em:#a16207;
  --focus:#2563eb;
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a { color:var(--focus); }

/* ── Header ── */
header { padding:36px 20px 26px; text-align:center; border-bottom:1px solid var(--border); }
h1 {
  font-family:'Noto Serif SC','Songti SC',serif;
  font-size:30px; color:var(--heading); letter-spacing:1px;
}
.subtitle { color:var(--muted); font-size:14px; margin-top:6px; }
.stats-row {
  display:flex; justify-content:center; gap:34px; margin-top:18px; flex-wrap:wrap;
}
.stat { text-align:center; }
.stat b { display:block; font-size:24px; color:var(--heading); font-family:'Noto Serif SC',serif; }
.stat span { font-size:12px; color:var(--muted); }
.stat.due b { color:var(--err); }
.stat.done b { color:var(--ok); }

/* ── 右上角按钮 ── */
.corner-btn {
  position:fixed; top:16px; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  z-index:100; text-decoration:none; font-size:13px; padding:0 10px;
  box-shadow:0 2px 8px rgba(0,0,0,.12); transition:border-color .2s,color .2s;
}
.corner-btn:hover { border-color:var(--border-strong); color:var(--heading); }
#themeBtn { right:16px; }
.back-link { right:64px; width:auto; min-width:38px; white-space:nowrap; border-radius:19px; }

/* ── 主体 ── */
main { max-width:920px; margin:0 auto; padding:20px 16px 80px; }

.card {
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; margin-bottom:16px;
}

/* ── 表单 ── */
.form-head {
  display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  font-weight:600; color:var(--heading); user-select:none;
}
.form-head .arrow { transition:transform .2s; color:var(--muted); font-size:12px; }
.form-head.closed .arrow { transform:rotate(-90deg); }
form { margin-top:14px; }
.form-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px 14px;
}
.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:12px; color:var(--muted); }
.field select, .field input, .field textarea {
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:6px;
  padding:7px 10px; font-size:13.5px; font-family:inherit;
}
.field textarea { resize:vertical; min-height:56px; }
.field :is(select,input,textarea):focus { outline:2px solid var(--focus); outline-offset:1px; }
.form-actions { display:flex; gap:10px; margin-top:14px; align-items:center; flex-wrap:wrap; }
button.primary {
  background:var(--focus); color:#fff; border:none; border-radius:7px;
  padding:8px 20px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
}
button.primary:hover { filter:brightness(1.1); }
button.ghost {
  background:transparent; color:var(--muted); border:1px solid var(--border);
  border-radius:7px; padding:7px 16px; font-size:13px; cursor:pointer; font-family:inherit;
}
button.ghost:hover { color:var(--heading); border-color:var(--border-strong); }
.hint { font-size:12px; color:var(--faint); }

/* ── 筛选 ── */
.filters { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:10px; }
.filters input, .filters select {
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px;
  width:100%; font-family:inherit;
}
@media (max-width:700px){ .filters { grid-template-columns:1fr 1fr; } }

/* ── 统计 ── */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:700px){ .stats-grid { grid-template-columns:1fr; } }
.stats-grid h3 { font-size:13px; color:var(--muted); font-weight:600; margin-bottom:8px; }
.bar-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:12.5px; }
.bar-row .name { width:9.5em; flex:none; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track { flex:1; height:12px; background:var(--hover-bg); border-radius:6px; overflow:hidden; }
.bar-fill { height:100%; background:var(--focus); border-radius:6px; min-width:2px; }
.bar-row .num { width:2.2em; text-align:right; color:var(--muted); flex:none; }

/* ── 错题卡片 ── */
.kp-card { border-left:3px solid var(--focus); }
.kp-card.done { border-left-color:var(--ok); opacity:.75; }
.meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.chip {
  font-size:11.5px; padding:2px 9px; border-radius:10px;
  border:1px solid var(--border); color:var(--muted); background:var(--surface);
}
.chip.kp { color:var(--focus); border-color:var(--focus); font-weight:600; }
.chip.cause { color:var(--tip); border-color:var(--tip); }
.chip.st { color:var(--err); border-color:var(--err); font-weight:600; }
.done .chip.st { color:var(--ok); border-color:var(--ok); }
.stem { color:var(--text); font-size:14px; }
.keyline {
  margin-top:8px; padding:8px 12px; font-size:13px; color:var(--muted);
  background:var(--hover-bg); border-left:3px solid var(--ok); border-radius:4px;
}
.keyline b { color:var(--ok); }
.ops { display:flex; gap:8px; margin-top:10px; }
.ops button {
  background:none; border:none; color:var(--muted); font-size:12.5px;
  cursor:pointer; padding:2px 4px; font-family:inherit;
}
.ops button:hover { color:var(--heading); text-decoration:underline; }
.ops .del:hover { color:var(--err); }
.empty { text-align:center; color:var(--faint); padding:48px 0; }
.empty b { display:block; font-size:17px; color:var(--muted); margin-bottom:6px; }
</style>

<script>
'use strict';
var LS_KEY = 'ds13003-mistakes';
var $ = function(id){ return document.getElementById(id); };
var list = [];

function load(){ try{ list = JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ list = []; } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }catch(e){ alert('保存失败：浏览器存储不可用'); } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var CH_OF = {1:1,2:1,3:1,4:1,5:1,6:2,7:2,8:2,9:2,10:2,11:2,12:2,13:2,14:2,15:3,16:3,17:3,18:3,19:3,20:3,21:3,22:4,23:4,24:4,25:4,26:4,27:5,28:5,29:5,30:5,31:5,32:5,33:5,34:5,35:5,36:5,37:6,38:6,39:6,40:6,41:6,42:6,43:6,44:7,45:7,46:7,47:7,48:7,49:7,50:7,51:8,52:8,53:8,54:8,55:8,56:8,57:8,58:8};

function chOf(rec){ var m = /考点(\d+)/.exec(rec.kp||''); return m ? CH_OF[+m[1]] || 0 : 0; }

$('themeBtn').addEventListener('click', function(){

  editingId = null;
  $('form').reset();
  $('formTitle').textContent = '＋ 记一道错题';
  $('saveBtn').textContent = '保存错题';
  $('cancelBtn').hidden = true;
}
$('cancelBtn').addEventListener('click', resetForm);

$('form').addEventListener('submit', function(ev){
  ev.preventDefault();
  var stem = $('fStem').value.trim();
  if(!stem){ alert('题干摘要还是要写一句的，不然回头不知道错在哪'); return; }
  var rec = {
    id: editingId || (Date.now() + '' + Math.floor(Math.random()*1e4)),
    src: $('fSrc').value, no: $('fNo').value.trim(), type: $('fType').value,
    kp: $('fKp').value, cause: $('fCause').value, status: $('fSt').value,
    stem: stem, key: $('fKey').value.trim(), updated: Date.now()
  };
  if(editingId){
    var i = list.findIndex(function(r){ return r.id === editingId; });
    if(i >= 0) rec.created = list[i].created;
    list[i] = rec;
  }else{
    rec.created = Date.now();
    list.unshift(rec);
  }
  save(); resetForm(); render();
});

function startEdit(id){
  var r = list.find(function(x){ return x.id === id; });
  if(!r) return;
  editingId = id;
  $('fSrc').value = r.src; $('fNo').value = r.no || ''; $('fType').value = r.type;
  $('fKp').value = r.kp; $('fCause').value = r.cause; $('fSt').value = r.status;
  $('fStem').value = r.stem; $('fKey').value = r.key || '';
  $('formTitle').textContent = '✎ 编辑错题';
  $('saveBtn').textContent = '保存修改';
  $('cancelBtn').hidden = false;
  $('form').hidden = false; $('formHead').classList.remove('closed');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function del(id){
  if(!confirm('删除这条错题？')) return;
  list = list.filter(function(r){ return r.id !== id; });
  save(); render();
}
function toggleDone(id){
  var r = list.find(function(x){ return x.id === id; });
  if(!r) return;
  r.status = r.status === '已掌握' ? '未掌握' : '已掌握';
  r.updated = Date.now();
  save(); render();
}

/* ── 筛选 ── */
function setOptions(sel, values, allLabel){
  var html = '<option value="">' + allLabel + '</option>' +
    values.map(function(v){ return '<option>' + esc(v) + '</option>'; }).join('');
  if(sel.innerHTML !== html){          // 选项没变就不重建，保住用户已选的筛选值
    var keep = sel.value;
    sel.innerHTML = html;
    if(values.indexOf(keep) >= 0) sel.value = keep;
  }
}
function fillFilterOptions(){
  var kps = [], causes = [];
  list.forEach(function(r){
    if(r.kp && kps.indexOf(r.kp) < 0) kps.push(r.kp);
    if(r.cause && causes.indexOf(r.cause) < 0) causes.push(r.cause);
  });
  kps.sort(function(a,b){ return parseInt(a.slice(2)) - parseInt(b.slice(2)); });
  setOptions($('qKp'), kps, '全部考点');
  setOptions($('qCause'), causes, '全部错因');
}
function filtered(){
  var q = $('qSearch').value.trim().toLowerCase();
  var fk = $('qKp').value, fc = $('qCause').value, fs = $('qSt').value;
  return list.filter(function(r){
    if(fk && r.kp !== fk) return false;
    if(fc && r.cause !== fc) return false;
    if(fs && r.status !== fs) return false;
    if(q){
      var hay = ((r.stem||'') + ' ' + (r.key||'') + ' ' + (r.no||'') + ' ' + (r.kp||'')).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

/* ── 渲染 ── */
function render(){
  fillFilterOptions();
  var total = list.length;
  var done = list.filter(function(r){ return r.status === '已掌握'; }).length;
  var week = list.filter(function(r){ return Date.now() - (r.created||0) < 7*864e5; }).length;
  $('stTotal').textContent = total;
  $('stDone').textContent = done;
  $('stDue').textContent = total - done;
  $('stWeek').textContent = week;

  // 统计条
  var chCount = {}, causeCount = {};
  list.forEach(function(r){
    var c = chOf(r); chCount[c] = (chCount[c]||0) + 1;
    causeCount[r.cause] = (causeCount[r.cause]||0) + 1;
  });
  var maxCh = Math.max.apply(null, [1].concat(Object.keys(chCount).map(function(k){ return chCount[k]; })));
  $('chBars').innerHTML = Object.keys(CH_NAME).map(function(k){
    var n = chCount[k] || 0;
    return '<div class="bar-row"><span class="name">' + CH_NAME[k] + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (n/maxCh*100) + '%"></div></div>' +
      '<span class="num">' + n + '</span></div>';
  }).join('');
  var causes = Object.keys(causeCount).sort(function(a,b){ return causeCount[b] - causeCount[a]; });
  var maxC = Math.max.apply(null, [1].concat(causes.map(function(k){ return causeCount[k]; })));
  $('causeBars').innerHTML = causes.length ? causes.map(function(k){
    return '<div class="bar-row"><span class="name">' + esc(k) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (causeCount[k]/maxC*100) + '%"></div></div>' +
      '<span class="num">' + causeCount[k] + '</span></div>';
  }).join('') : '<div class="hint">暂无数据</div>';
  $('statsCard').hidden = total === 0;

  var rows = filtered();
  if(!rows.length){
    $('list').innerHTML = '<div class="card empty"><b>' +
      (total ? '没有符合筛选条件的错题' : '还没有错题') + '</b>' +
      (total ? '' : '做错一道题，就在上面记一笔：错在哪、正确思路是什么、属于哪个考点。') + '</div>';
    return;
  }
  $('list').innerHTML = rows.map(function(r){
    var doneCls = r.status === '已掌握' ? ' done' : '';
    return '<div class="card kp-card' + doneCls + '">' +
      '<div class="meta">' +
        '<span class="chip">' + esc(r.src) + (r.no ? ' · ' + esc(r.no) : '') + '</span>' +
        '<span class="chip">' + esc(r.type) + '</span>' +
        (r.kp ? '<span class="chip kp">' + esc(r.kp) + '</span>' : '') +
        '<span class="chip cause">' + esc(r.cause) + '</span>' +
        '<span class="chip st">' + esc(r.status) + '</span>' +
      '</div>' +
      '<div class="stem">' + esc(r.stem) + '</div>' +
      (r.key ? '<div class="keyline"><b>正确思路：</b>' + esc(r.key) + '</div>' : '') +
      '<div class="ops">' +
        '<button data-act="done" data-id="' + r.id + '">' + (r.status === '已掌握' ? '标回未掌握' : '标记已掌握') + '</button>' +
        '<button data-act="edit" data-id="' + r.id + '">编辑</button>' +
        '<button class="del" data-act="del" data-id="' + r.id + '">删除</button>' +
      '</div></div>';
  }).join('');
}

$('list').addEventListener('click', function(ev){
  var btn = ev.target.closest('button[data-act]');
  if(!btn) return;
  var id = btn.getAttribute('data-id');
  if(btn.getAttribute('data-act') === 'done') toggleDone(id);
  else if(btn.getAttribute('data-act') === 'edit') startEdit(id);
  else if(btn.getAttribute('data-act') === 'del') del(id);
});
['qSearch','qKp','qCause','qSt'].forEach(function(id){
  $(id).addEventListener('input', render);
  $(id).addEventListener('change', render);
});

/* ── 导出 / 导入 ── */
function download(name, text){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
$('list').parentElement; // noop keep ordering
var exportBtn = document.createElement('button');
exportBtn.className = 'ghost'; exportBtn.textContent = '导出 JSON';
exportBtn.addEventListener('click', function(){
  if(!list.length){ alert('还没有错题可导出'); return; }
  download('13003错题集-' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(list, null, 2));
});
var importBtn = document.createElement('button');
importBtn.className = 'ghost'; importBtn.textContent = '导入 JSON';
var fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.accept = '.json,application/json'; fileInput.hidden = true;
fileInput.addEventListener('change', function(){
  var f = fileInput.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw 0;
      var ids = {}; list.forEach(function(r){ ids[r.id] = 1; });
      var added = 0, updated = 0;
      data.forEach(function(r){
        if(!r || !r.id || !r.stem) return;
        if(ids[r.id]){ var i = list.findIndex(function(x){ return x.id === r.id; }); list[i] = r; updated++; }
        else { list.push(r); ids[r.id] = 1; added++; }
      });
      save(); render();
      alert('导入完成：新增 ' + added + ' 条，覆盖 ' + updated + ' 条');
    }catch(e){ alert('导入失败：不是有效的错题集 JSON'); }
    fileInput.value = '';
  };
  reader.readAsText(f, 'utf-8');
});
importBtn.addEventListener('click', function(){ fileInput.click(); });
var clearBtn = document.createElement('button');
clearBtn.className = 'ghost'; clearBtn.textContent = '清空';
clearBtn.addEventListener('click', function(){
  if(!list.length) return;
  if(confirm('确定清空全部 ' + list.length + ' 条错题？此操作不可撤销（建议先导出备份）')){
    list = []; save(); render();
  }
});
var opsRow = document.querySelector('.form-actions');
opsRow.appendChild(exportBtn); opsRow.appendChild(importBtn); opsRow.appendChild(clearBtn);
opsRow.appendChild(fileInput);

load();
render();
</script>
</body>
</html>
