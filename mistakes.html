<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题本 · 13003 数据结构与算法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){
  var t;
  try{ t=localStorage.getItem('theme'); }catch(e){}
  if(t!=='light'&&t!=='dark'){ t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
:root {
  --c1:#60a5fa; --c2:#34d399; --c3:#fbbf24;
  --c4:#f472b6; --c5:#a78bfa; --c6:#22d3ee;
  --c7:#fb923c; --c8:#a3e635;
  --bg:#0d1117; --surface:#161b22; --card:#1c2230;
  --border:#2a3344; --border-strong:#3d4f66;
  --text:#c9d2dd; --muted:#7d8fa8; --faint:#4a5568;
  --heading:#e2eaf2;
  --hover-bg:rgba(255,255,255,.03);
  --tag-bg:rgba(255,255,255,.07); --tag-text:#9ab;
  --ok:#34d399; --err:#f87171;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#f3f1ec; --surface:#faf9f5; --card:#faf9f5;
  --border:#e2dfd7; --border-strong:#c9c5ba;
  --text:#33393f; --muted:#626b7a; --faint:#9aa1ab;
  --heading:#242930;
  --hover-bg:rgba(45,45,55,.045);
  --tag-bg:rgba(45,45,55,.06); --tag-text:#5d6570;
  --ok:#047857; --err:#dc2626;
  --c1:#2563eb; --c2:#059669; --c3:#d97706;
  --c4:#db2777; --c5:#7c3aed; --c6:#0891b2;
  --c7:#ea580c; --c8:#65a30d;
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:860px; margin:0 auto; padding:0 16px 60px; }

/* ── 右上角浮动按钮 ── */
.topbar { position:fixed; top:16px; right:16px; display:flex; gap:10px; z-index:100; }
.topbar a, .topbar button {
  height:38px; border-radius:19px; border:1px solid var(--border);
  background:var(--surface); color:var(--muted); cursor:pointer;
  display:flex; align-items:center; gap:6px; padding:0 13px;
  font-size:12.5px; font-family:inherit; text-decoration:none;
  transition:color .15s, border-color .15s;
}
.topbar a:hover, .topbar button:hover { color:var(--heading); border-color:var(--border-strong); }
.topbar a:focus-visible, .topbar button:focus-visible { outline:2px solid var(--c1); outline-offset:2px; }

/* ── 页头 ── */
header { padding:56px 4px 22px; border-bottom:1px solid var(--border); margin-bottom:16px; }
header h1 {
  font-family:'Noto Serif SC','Songti SC',serif;
  font-size:26px; font-weight:700; letter-spacing:2px;
  color:var(--heading); margin-bottom:6px;
}
header .sub { font-size:12.5px; color:var(--muted); letter-spacing:.5px; }

/* ── 旧版 localStorage 数据提示条 ── */
.legacy {
  border:1px dashed var(--border-strong); border-radius:10px;
  padding:10px 14px; margin-bottom:14px; font-size:12.5px; color:var(--muted);
}
.legacy:not([hidden]) { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.legacy b { color:var(--heading); }

/* ── 筛选条 ── */
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.chipbtn {
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  border-radius:14px; padding:3px 12px; font-size:12.5px;
  cursor:pointer; font-family:inherit; transition:color .15s, border-color .15s, background .15s;
}
.chipbtn:hover { color:var(--heading); border-color:var(--border-strong); }
.chipbtn.on { background:var(--heading); border-color:var(--heading); color:var(--bg); }
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px; }
.ctrlrow { display:flex; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:6px; }
.ctrlrow label { font-size:12.5px; color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:5px; }
.ctrlrow input[type=checkbox] { accent-color:var(--c1); }
.stat { font-size:12px; color:var(--faint); margin-bottom:16px; }

/* ── 真题卷分组 ── */
.exam { border:1px solid var(--border); border-radius:10px; background:var(--surface); margin-bottom:12px; overflow:hidden; }
.exam-head { display:flex; align-items:center; gap:10px; padding:11px 16px; cursor:pointer; user-select:none; }
.exam-head:hover { background:var(--hover-bg); }
.exam-name { font-family:'Noto Serif SC',serif; font-weight:700; font-size:15.5px; letter-spacing:.5px; color:var(--heading); }
.exam-count { font-size:12px; color:var(--muted); }
.exam-todo { font-size:12px; color:var(--err); }
.exam-ok { font-size:12px; color:var(--ok); }
.exam-arrow { margin-left:auto; color:var(--faint); font-size:12px; transition:transform .18s; }
.exam.open .exam-arrow { transform:rotate(180deg); }
.exam-body { display:none; border-top:1px solid var(--border); }
.exam.open .exam-body { display:block; }

/* ── 错题卡片 ── */
.mistake { padding:14px 16px; }
.mistake + .mistake { border-top:1px dashed var(--border); }
.mtags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; }
.tag { font-size:11.5px; border-radius:10px; padding:1px 9px; background:var(--tag-bg); color:var(--tag-text); }
.tag.chc, .tag.wtag, .tag.dtag { background:var(--tag-bg); border:1px solid currentColor; }
.q { font-size:14.5px; font-weight:500; color:var(--heading); margin-bottom:6px; }
.opts { margin:2px 0 6px; }
.opt { font-size:13.5px; padding:1px 0 1px 12px; color:var(--text); }
.code {
  margin:2px 0 8px; padding:9px 12px; border-radius:8px;
  background:var(--tag-bg); border:1px solid var(--border);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  font-size:12.5px; line-height:1.55; color:var(--text);
  overflow-x:auto; white-space:pre;
}
.frow .code { margin-top:8px; background:var(--surface); }
.wrow { font-size:13.5px; }
.wrow b { color:var(--err); font-weight:600; margin-right:4px; }
.reveal {
  margin-top:9px; border:1px dashed var(--border-strong); background:none;
  color:var(--muted); border-radius:8px; padding:3px 12px;
  font-size:12.5px; cursor:pointer; font-family:inherit;
  transition:color .15s, border-color .15s;
}
.reveal:hover { color:var(--heading); border-color:var(--muted); }
.frow { margin-top:9px; font-size:13.5px; padding:9px 12px; border-radius:8px; background:var(--tag-bg); }
.frow b { color:var(--ok); font-weight:600; margin-right:4px; }
.showfix .frow { display:block; }

/* ── 空状态 ── */
.empty { text-align:center; padding:70px 20px; color:var(--muted); }
.empty .big { font-size:40px; margin-bottom:14px; }
.empty p { font-size:13.5px; line-height:2; }

@media (max-width:600px) {
  header { padding:52px 4px 18px; }
  header h1 { font-size:21px; }
  .topbar { top:10px; }
  .topbar a, .topbar button { height:36px; font-size:12px; }
}
@media (prefers-reduced-motion:reduce) {
  .exam-arrow, .topbar a, .topbar button, .chipbtn, .reveal { transition:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html" aria-label="返回考点笔记" title="返回考点笔记">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      考点笔记
    </a>
    <button onclick="toggleTheme()" aria-label="切换亮色/暗色模式" title="切换亮色/暗色模式">
      <span id="themeIcon">🌗</span>
    </button>
  </div>
  <header>
    <h1>错题本</h1>
    <div class="sub">13003 数据结构与算法 · 按真题卷归档 · 错题由 AI 总结录入</div>
  </header>
  <div class="legacy" id="legacy" hidden>
    <span>浏览器里还留着旧版错题 <b id="legacyN">0</b> 条（旧页面存在 localStorage，本页不再读取）。</span>
    <button class="reveal" id="legacyBtn">导出为 JSON</button>
    <button class="reveal" id="legacyClose">知道了</button>
  </div>
  <div class="chips" id="chChips"></div>
  <div class="ctrlrow">
    <label><input type="checkbox" id="onlyTodo" onchange="renderAll()"> 只看未掌握</label>
    <label><input type="checkbox" id="showFix" onchange="renderAll()"> 直接显示正确思路（复习模式）</label>
  </div>
  <div class="stat" id="stat"></div>
  <div id="groups"></div>
  <div class="empty" id="empty" hidden></div>
</div>
<script src="mistakes-data.js"></script>
<script>
var CH_NAMES = ['','第一章 绪论','第二章 线性表','第三章 栈和队列','第四章 数组、广义表和串','第五章 树与二叉树','第六章 图结构','第七章 内部排序','第八章 查找'];
var curCh = 0;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function examSortVal(name){
  var m = /(\d{4})\s*年\s*(\d{1,2})\s*月/.exec(name||'');
  return m ? (+m[1])*100 + (+m[2]) : 0;
}
function toggleTheme(){var r=document.documentElement,next=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',next);try{localStorage.setItem('theme',next)}catch(e){}}
function toggleFix(btn){
  var f = btn.nextElementSibling;
  f.hidden = !f.hidden;
  btn.textContent = f.hidden ? '看正确思路' : '收起解答';
}
function setCh(i){ curCh = i; renderAll(); }

function renderChips(){
  var html = '<button class="chipbtn'+(curCh===0?' on':'')+'" onclick="setCh(0)">全部</button>';
  for(var i=1;i<=8;i++){
    html += '<button class="chipbtn'+(curCh===i?' on':'')+'" onclick="setCh('+i+')"><span class="dot" style="background:var(--c'+i+')"></span>'+CH_NAMES[i]+'</button>';
  }
  document.getElementById('chChips').innerHTML = html;
}

function renderAll(){
  var data = window.MISTAKES || [];
  renderChips();
  var onlyTodo = document.getElementById('onlyTodo').checked;
  var showFix = document.getElementById('showFix').checked;
  var groupsEl = document.getElementById('groups');
  var emptyEl = document.getElementById('empty');

  if(!data.length){
    groupsEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyEl.innerHTML = '<div class="big">📚</div><p>还没有错题记录。<br>做题时把错题发给 AI（题干 + 我选了什么），AI 总结后录入 mistakes-data.js，<br>推送上线后这里就会按真题卷分组显示。</p>';
    document.getElementById('stat').textContent = '';
    return;
  }

  var todoN = data.filter(function(x){ return !x.done; }).length;
  var fdata = data.filter(function(x){ return curCh===0 || (+x.ch||0)===curCh; })
                  .filter(function(x){ return !onlyTodo || !x.done; });
  document.getElementById('stat').textContent =
    '共 '+data.length+' 题 · 未掌握 '+todoN+
    ((curCh||onlyTodo) ? ' · 当前显示 '+fdata.length+' 题' : '');

  if(!fdata.length){
    groupsEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyEl.innerHTML = '<div class="big">🔍</div><p>当前筛选条件下没有错题。<br>点击上方「全部」或取消「只看未掌握」可查看全部记录。</p>';
    return;
  }
  emptyEl.hidden = true;

  var exams = {};
  fdata.forEach(function(x){
    var k = x.exam || '未编号';
    (exams[k] = exams[k] || []).push(x);
  });
  var keys = Object.keys(exams).sort(function(a,b){
    var d = examSortVal(b) - examSortVal(a);
    return d !== 0 ? d : (a < b ? 1 : a > b ? -1 : 0);
  });

  var html = '';
  keys.forEach(function(k, gi){
    var items = exams[k];
    var gtodo = items.filter(function(x){ return !x.done; }).length;
    html += '<div class="exam'+(gi===0?' open':'')+'">'
         +  '<div class="exam-head" onclick="this.parentNode.classList.toggle(\'open\')">'
         +  '<span class="exam-name">'+esc(k)+'</span>'
         +  '<span class="exam-count">'+items.length+' 题</span>'
         +  (gtodo ? '<span class="exam-todo">'+gtodo+' 未掌握</span>'
                   : '<span class="exam-ok">全部掌握 ✓</span>')
         +  '<span class="exam-arrow">▼</span></div><div class="exam-body">';
    items.forEach(function(x){
      var ch = +x.ch || 0;
      html += '<div class="mistake"><div class="mtags">';
      if(ch) html += '<span class="tag chc" style="color:var(--c'+ch+')">'+CH_NAMES[ch]+'</span>';
      if(x.kp) html += '<span class="tag">'+esc(x.kp)+'</span>';
      if(x.no) html += '<span class="tag">'+esc(x.no)+'</span>';
      html += '<span class="tag '+(x.done?'dtag':'wtag')+'">'+(x.done?'已掌握':'未掌握')+'</span>';
      html += '</div><div class="q">'+esc(x.q)+'</div>';
      if(x.code) html += '<pre class="code">'+esc(x.code)+'</pre>';
      if(x.opts && x.opts.length){
        html += '<div class="opts">'+x.opts.map(function(o){ return '<div class="opt">'+esc(o)+'</div>'; }).join('')+'</div>';
      }
      if(x.wrong) html += '<div class="wrow"><b>✗ 错因</b>'+esc(x.wrong)+'</div>';
      html += '<button class="reveal" onclick="toggleFix(this)">看正确思路</button>'
           +  '<div class="frow" hidden><b>✓ 思路</b>'+esc(x.fix)
           +  (x.fixcode ? '<pre class="code">'+esc(x.fixcode)+'</pre>' : '')
           +  '</div></div>';
    });
    html += '</div></div>';
  });
  groupsEl.innerHTML = html;
  groupsEl.classList.toggle('showfix', showFix);
}

renderAll();

/* ── 旧版 localStorage 错题：一次性导出，导完可忽略 ── */
(function(){
  var legacy = null;
  try{ legacy = JSON.parse(localStorage.getItem('ds13003-mistakes')); }catch(e){}
  if(!legacy || !legacy.length) return;
  var done = false;
  try{ done = localStorage.getItem('ds13003-mistakes-legacy') === 'done'; }catch(e){}
  if(done) return;
  var bar = document.getElementById('legacy');
  bar.hidden = false;
  document.getElementById('legacyN').textContent = legacy.length;
  document.getElementById('legacyBtn').onclick = function(){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(legacy, null, 2)], { type:'application/json' }));
    a.download = '13003旧错题-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById('legacyClose').onclick = function(){
    try{ localStorage.setItem('ds13003-mistakes-legacy', 'done'); }catch(e){}
    bar.hidden = true;
  };
})();
</script>
</body>
</html>
